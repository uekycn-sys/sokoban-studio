name: Deploy Sokoban Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过进行中的运行
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 构建任务：安装依赖、严格验算关卡、打包产物并上传
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 全量关卡合法性与 AI 可解性强制验算
        run: npm run verify-levels

      - name: 生产环境构建打包
        run: npm run build

      - name: 上传 GitHub Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 部署任务：从 build 任务接收产物并发布至 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 自动化部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
